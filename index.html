<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: comic-panel column. A red splash header with a countdown burst and a ring gauge, then inked panels of checkable rows on halftone paper. */
:root{
  --bg:#fbfaf6; --surface:#ffffff; --ink:#141414; --muted:#56565c; --edge:#141414; --shadow:#141414; --soft:#e4e2dd;
  --red:#d42a2f; --yellow:#ffcc29; --on-red:#ffffff; --on-yellow:#141414; --done:#9b9ba1; --dots:rgba(212,42,47,.15);
  --accent:var(--red);
  --f-display:"Bangers",Impact,"Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101013; --surface:#1a1a1f; --ink:#f2f2f2; --muted:#a8a8b0; --edge:#000000; --shadow:#000000; --soft:#2b2b32;
  --red:#e8353a; --yellow:#ffd23f; --done:#6e6e76; --dots:rgba(232,53,58,.16); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101013; --surface:#1a1a1f; --ink:#f2f2f2; --muted:#a8a8b0; --edge:#000000; --shadow:#000000; --soft:#2b2b32;
  --red:#e8353a; --yellow:#ffd23f; --done:#6e6e76; --dots:rgba(232,53,58,.16); color-scheme:dark}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dots) 1.3px,transparent 1.8px);background-size:11px 11px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}

.plate{position:relative;overflow:hidden;background:var(--red);color:var(--on-red);border:3px solid var(--edge);border-radius:4px;box-shadow:6px 6px 0 var(--shadow);padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px}
.plate::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 105% -10%,rgba(255,255,255,.11) 0deg 5deg,transparent 5deg 11deg);pointer-events:none}
.plate::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.22) 1.2px,transparent 1.7px);background-size:8px 8px;-webkit-mask-image:linear-gradient(to top,#000,transparent 65%);mask-image:linear-gradient(to top,#000,transparent 65%);pointer-events:none}
.plate>*{position:relative;z-index:1}
.eyebrow{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,11vw,88px);line-height:.9;letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--yellow);-webkit-text-stroke:1.5px var(--edge);text-shadow:4px 4px 0 var(--edge);text-wrap:balance}

.hud{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:18px}
.burst{width:122px;height:122px;display:grid;place-content:center;text-align:center;background:var(--yellow);color:var(--on-yellow);clip-path:polygon(50% 0,61% 17%,82% 8%,80% 30%,100% 36%,86% 52%,100% 68%,79% 72%,82% 94%,61% 84%,50% 100%,39% 84%,18% 94%,21% 72%,0 68%,14% 52%,0 36%,20% 30%,18% 8%,39% 17%);transform:rotate(-6deg)}
.burst b{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1;letter-spacing:.02em}
.burst span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.gauge{width:116px;height:116px;display:block}
.g-track{fill:none;stroke:rgba(0,0,0,.28);stroke-width:13}
.g-fill{fill:none;stroke:var(--yellow);stroke-width:13;transition:stroke-dashoffset .4s}
.g-num{font-family:var(--f-display);font-size:32px;fill:var(--on-red);text-anchor:middle}
.g-lab{font-family:var(--f-body);font-size:9.5px;font-weight:600;letter-spacing:.08em;fill:var(--on-red);text-anchor:middle}
.nums{display:grid;gap:7px;min-width:0}
.nums div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:6px;border-bottom:2px dashed rgba(255,255,255,.35)}
.nums div:last-child{border-bottom:0;padding-bottom:0}
.nums b{font-family:var(--f-mono);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.nums span{font-size:12.5px}
@media (max-width:560px){.hud{grid-template-columns:auto auto;justify-content:start}.nums{grid-column:1/-1}}

.search{position:relative;display:flex;align-items:center}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 46px 12px 46px;border:3px solid var(--edge);border-radius:4px;background:var(--surface);color:var(--ink);box-shadow:4px 4px 0 var(--shadow);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{outline:3px solid var(--yellow);outline-offset:2px}
.search .lens{position:absolute;left:15px;top:50%;width:16px;height:16px;margin-top:-10px;border:3px solid var(--ink);border-radius:50%;pointer-events:none}
.search .lens::after{content:"";position:absolute;width:3px;height:9px;background:var(--ink);right:-6px;bottom:-8px;transform:rotate(-45deg);border-radius:2px}
.search .sx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:2px solid var(--edge);border-radius:50%;background:var(--yellow);color:var(--on-yellow);font-size:14px;line-height:1;cursor:pointer}
.search .sx:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.noresult{padding:18px;border:3px dashed var(--edge);border-radius:4px;background:var(--surface)}
.noresult p{margin:0 0 8px}
#list{display:flex;flex-direction:column;gap:24px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.toggles{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.clear{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px}
.clear .ask{font-size:14px;font-weight:600}
.cbtn{font:inherit;font-size:14px;font-weight:500;padding:5px 12px;border:2px solid var(--edge);border-radius:3px;background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--edge)}
.cbtn:hover{background:color-mix(in srgb,var(--yellow) 25%,var(--surface))}
.cbtn:disabled{opacity:.45;cursor:default;box-shadow:none}
.cbtn.danger{background:var(--red);color:var(--on-red)}
.cbtn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.no-why .name .why{display:none}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:500;background:var(--surface);border:2px solid var(--edge);border-radius:3px;padding:5px 10px}
.toggle input{width:18px;height:18px;accent-color:var(--red)}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-height:1em}
.status.ok{color:var(--ink);font-weight:500}

.phase{display:flex;align-items:center;gap:12px;margin:12px 0 -6px}
.phase h2{font-family:var(--f-display);font-weight:400;font-size:36px;letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--ink)}
.phase p{margin:0;color:var(--muted);font-size:13px}
.phase::after{content:"";flex:1;height:5px;background:var(--red);transform:skewX(-20deg)}

.block{background:var(--surface);border:3px solid var(--edge);border-radius:4px;box-shadow:5px 5px 0 var(--shadow);overflow:hidden}
.block header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 14px 12px;background:var(--edge);color:var(--on-red)}
.block h3{font-family:var(--f-display);font-weight:400;font-size:27px;letter-spacing:.04em;text-transform:uppercase;margin:0;flex:1;min-width:0;color:var(--yellow)}
.block header{position:relative}
.fold{all:unset;cursor:pointer}
.fold::before{content:"";position:absolute;inset:0;z-index:1}
.fold:focus-visible::before{outline:3px solid var(--yellow);outline-offset:-4px}
.block header:hover{filter:brightness(1.12)}
.chev{width:26px;height:26px;flex:none;display:grid;place-items:center;border:2px solid var(--yellow);border-radius:50%;transition:transform .2s}
.chev::before{content:"";width:7px;height:7px;border-right:2.5px solid var(--yellow);border-bottom:2.5px solid var(--yellow);transform:translateY(-2px) rotate(45deg)}
.block.shut .chev{transform:rotate(-90deg)}
.block.shut ul{display:none}
.block.shut header{border-bottom:0}
.block .meta{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;opacity:.85}
.block .bnote{flex-basis:100%;margin:0;font-size:12.5px;opacity:.78}
.segs{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;padding-top:2px}
.segs i{flex:1 1 10px;min-width:8px;max-width:30px;height:9px;background:rgba(255,255,255,.18);transform:skewX(-18deg)}
.segs i.on{background:var(--red)}
.block.complete header{background:var(--red)}
.block.complete h3{color:var(--yellow);-webkit-text-stroke:1px var(--edge)}
.block.complete .segs i.on{background:var(--yellow)}

ul{list-style:none;margin:0;padding:0}
li+li{border-top:2px solid var(--soft)}
.row{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto auto 24px;align-items:center;gap:14px;padding:14px 16px;min-height:64px;transition:background .15s}
.row:hover{background:color-mix(in srgb,var(--yellow) 18%,var(--surface))}
.tick{position:relative;z-index:2;display:grid;place-items:center;width:28px;height:28px;cursor:pointer}
.tick input{position:absolute;inset:-10px;width:auto;height:auto;margin:0;opacity:0;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.box{width:26px;height:26px;border:3px solid var(--ink);border-radius:4px;display:grid;place-items:center;background:var(--surface);box-shadow:2px 2px 0 var(--edge);transition:background .15s,transform .15s}
.box::after{content:"";width:11px;height:6px;border-left:3px solid var(--on-red);border-bottom:3px solid var(--on-red);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.tick:hover .box{transform:scale(1.08)}
.row input:checked+.box{background:var(--red);transform:rotate(-6deg)}
.row input:checked+.box::after{opacity:1}
.row input:focus-visible+.box{outline:3px solid var(--yellow);outline-offset:3px}
.name{position:static;display:block;width:100%;min-width:0;margin:0;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;overflow-wrap:anywhere;cursor:pointer}
.name::before{content:"";position:absolute;inset:0;z-index:1}
.name:focus-visible{outline:none}
.name:focus-visible::before{outline:3px solid var(--yellow);outline-offset:-4px}
.name .t{display:block;font-size:16px;font-weight:600;line-height:1.3}
.name small{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin-top:4px;font-size:12.5px;color:var(--muted);font-weight:400}
.name small .sep{opacity:.6}
.u{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.u::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--uc,var(--red));box-shadow:0 0 0 1.5px var(--edge)}
.name .why{display:block;margin-top:6px;padding-left:18px;position:relative;font-size:13px;line-height:1.45;font-weight:400;color:var(--ink);opacity:.85}
.name .why::before{content:"\2192";position:absolute;left:0;top:0;color:var(--red);font-weight:700}
.kind{font-family:var(--f-display);font-size:14px;line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:var(--on-yellow);background:var(--yellow);border:2px solid var(--edge);border-radius:3px;padding:0 7px;transform:rotate(-3deg)}
.kind.serie{background:var(--surface);color:var(--ink);border-color:var(--ink);transform:rotate(2deg)}
.dur{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:4.6em}
.go{width:24px;height:24px;display:grid;place-items:center;border:2px solid var(--edge);border-radius:50%;background:var(--yellow);transition:transform .15s}
.go::before{content:"";width:6px;height:6px;border-top:2.5px solid var(--on-yellow);border-right:2.5px solid var(--on-yellow);transform:translateX(-1px) rotate(45deg)}
.row:hover .go{transform:translateX(3px)}
li.done .row{background:color-mix(in srgb,var(--soft) 40%,var(--surface))}
li.done .row:hover{background:color-mix(in srgb,var(--yellow) 14%,var(--surface))}
li.done .name{color:var(--done)}
li.done .name .u{color:var(--done)}
li.done .name .t{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
li.done .name .why{opacity:.6}
li.done .kind,li.done .go{opacity:.45}

button.cinema{width:100%;font:inherit;text-align:left;cursor:pointer}
button.cinema:focus-visible{outline:3px solid var(--red);outline-offset:4px}
.cinema{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--yellow);color:var(--on-yellow);border:3px solid var(--edge);border-radius:4px;box-shadow:6px 6px 0 var(--red);padding:16px 18px;transform:rotate(-1deg);margin-block:8px}
.cinema strong{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1;letter-spacing:.03em;text-transform:uppercase;color:var(--red);-webkit-text-stroke:1px var(--edge)}
.cinema span{font-family:var(--f-mono);font-size:13px;font-weight:500}

.transfer{background:var(--surface);border:3px solid var(--edge);border-radius:4px;box-shadow:5px 5px 0 var(--shadow);padding:12px 14px}
.transfer summary{cursor:pointer;font-weight:600}
.transfer p{color:var(--muted);font-size:13px;margin:10px 0}
.transfer textarea{width:100%;font-family:var(--f-mono);font-size:12px;background:var(--bg);color:var(--ink);border:2px solid var(--edge);border-radius:3px;padding:8px;resize:vertical}
.tbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tbtns button{font-family:var(--f-display);font-size:18px;letter-spacing:.05em;padding:4px 14px;border-radius:3px;border:2px solid var(--edge);background:var(--red);color:var(--on-red);cursor:pointer;box-shadow:3px 3px 0 var(--edge)}
.tbtns button+button{background:var(--surface);color:var(--ink)}
.tbtns button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.tbtns button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;background:var(--edge);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--shadow)}
.tabs button{min-width:0;font-family:var(--f-display);font-size:clamp(13px,3.3vw,22px);line-height:1.1;letter-spacing:.03em;text-transform:uppercase;padding:9px 4px;overflow-wrap:anywhere;hyphens:auto;background:var(--surface);color:var(--ink);border:0;cursor:pointer}
.tabs button:focus-visible{z-index:1}
.tabs button[aria-selected="true"]{background:var(--yellow);color:var(--on-yellow);box-shadow:inset 0 -6px 0 var(--red)}
.tabs button:focus-visible{outline:3px solid var(--red);outline-offset:2px;position:relative;z-index:1}
.intro{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.block.year header{padding:8px 16px 10px}
.block.year h3{font-size:30px}
@media (max-width:560px){.block h3{flex-basis:100%}.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs button{font-size:15px;padding:10px 6px}}
@media (max-width:480px){.kind{display:none}.row{grid-template-columns:28px minmax(0,1fr) auto 24px;gap:12px;padding:14px 12px}.dur{min-width:0}}
dialog.sheet{padding:0;border:3px solid var(--edge);border-radius:4px;box-shadow:8px 8px 0 var(--red);background:var(--surface);color:var(--ink);width:min(720px,calc(100vw - 24px));max-width:none;max-height:min(86vh,900px);overflow:auto}
dialog.sheet::backdrop{background:rgba(10,10,12,.62)}
.sheet-in{padding-bottom:16px}
.sheet header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--red);color:var(--on-red);border-bottom:3px solid var(--edge);position:sticky;top:0;z-index:1}
.sheet .sk{margin:0 0 6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.03em}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1;letter-spacing:.03em;text-transform:uppercase;color:var(--yellow);-webkit-text-stroke:1px var(--edge);text-wrap:balance}
.sheet .x{flex:none;width:40px;height:40px;border:2px solid var(--edge);border-radius:3px;background:var(--surface);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;box-shadow:3px 3px 0 var(--edge)}
.sheet .x:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:16px 18px 0}
@media (max-width:600px){.cols{grid-template-columns:minmax(0,1fr)}}
.col h3{margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 10px;border:2px solid var(--edge);border-radius:3px;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.col.must h3{background:var(--red);color:var(--on-red)}
.col.refs h3{background:var(--yellow);color:var(--on-yellow)}
.col h3 span{font-family:var(--f-mono);font-size:12px;letter-spacing:0;text-transform:none;white-space:nowrap}
.col .lead{margin:8px 0;font-size:13px;color:var(--muted)}
.pre{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pre li+li{border-top:0}
.pre-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border:2px solid var(--edge);border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;font-weight:500;text-align:left;cursor:pointer}
.pre-item:hover{background:color-mix(in srgb,var(--yellow) 22%,var(--bg))}
.pre-item:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.pre .pt{min-width:0;overflow-wrap:anywhere}
.pre .ps{flex:none;padding:1px 6px;border-radius:2px;background:var(--red);color:var(--on-red);font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.pre li.seen .pt{color:var(--done);text-decoration:line-through;text-decoration-color:var(--red)}
.pre li.seen .ps{background:var(--soft);color:var(--muted)}
.sheet .empty{margin:0;padding:8px 0;font-size:14px;color:var(--muted)}
.sheet .foot{margin:16px 18px 0;font-size:12.5px;color:var(--muted)}
.where{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:16px 18px 0;padding:12px 14px;border:2px dashed var(--edge);border-radius:3px;background:var(--bg)}
.where .wl{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.where .wp{margin:3px 0 0;font-size:17px;font-weight:600}
.where .wp.unk{font-weight:500;color:var(--muted)}
.where .wn{margin:4px 0 0;font-size:12px;color:var(--muted)}
.jw{flex:none;display:inline-block;padding:7px 12px;border:2px solid var(--edge);border-radius:3px;background:var(--yellow);color:var(--on-yellow);font-size:14px;font-weight:600;text-decoration:none;box-shadow:3px 3px 0 var(--edge)}
.jw:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.jw:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    html += '<button type="button" class="cinema" data-info="doomsday" aria-haspopup="dialog"><strong>Avengers: Doomsday</strong><span>16/12/2026 · au cinéma · ce qu\u2019il faut avoir vu \u24D8</span></button>';
    return html;
  }
  function chronoHTML(){
    var html = '<p class="intro">Tout, rangé selon l’année où se passe l’histoire, tous univers confondus. Les coches sont les mêmes dans tous les onglets. Coche la case quand c’est vu ; touche le reste de la ligne pour voir ce qu’il faut avoir vu avant.</p>';
    CHRONO.forEach(function(g){
      var items = g[1].map(function(id){ return ITEM[id]; }).filter(Boolean);
      if (!items.length) return;
      if (g[0] === "Hors chronologie") html += '<button type="button" class="cinema" data-info="doomsday" aria-haspopup="dialog"><strong>Avengers: Doomsday</strong><span>16/12/2026 · au cinéma · ce qu\u2019il faut avoir vu \u24D8</span></button>';
      html += sectionHTML(g[0], g[2], items, true, "year");
    });
    return html;
  }
  var UNIVERS = [
    ["MCU · Marvel Studios", ["MCU", "Terre-828"], "Films et séries Marvel Studios, y compris les 4 Fantastiques de Terre-828."],
    ["MCU · Multivers animé", ["Multivers"], "What If…? et Marvel Zombies : des versions alternatives des héros du MCU."],
    ["Netflix · Defenders", ["Netflix"], "Les séries de Hell's Kitchen, que Born Again prolonge."],
    ["Marvel Television", ["ABC", "Hulu", "Freeform"], "Séries d'ABC, Hulu et Freeform pensées pour le MCU, que les films n'ont jamais reprises."],
    ["Fox", ["Fox"], "X-Men, Deadpool, les 4 Fantastiques, Daredevil et Elektra d'avant le rachat par Disney."],
    ["Sony · Spider-Man de Sam Raimi", ["Sam Raimi"], "La trilogie avec Tobey Maguire."],
    ["Sony · Spider-Man de Marc Webb", ["Marc Webb"], "Les deux films avec Andrew Garfield."],
    ["Sony · Univers Spider-Man", ["Sony"], "Venom, Morbius, Madame Web, Kraven et Spider-Noir."],
    ["Sony · Spider-Verse", ["Spider-Verse"], "Les films d'animation avec Miles Morales."],
    ["New Line · Blade", ["New Line"], "La trilogie avec Wesley Snipes."],
    ["Autres univers animés", ["Autre univers"], "Séries animées Marvel avec leur propre continuité."]
  ];
  function universHTML(){
    var html = '<p class="intro">Tout, regroupé par studio et par univers, puis par date de sortie. Les coches sont les mêmes dans tous les onglets. Coche la case quand c\u2019est vu ; touche le reste de la ligne pour voir ce qu\u2019il faut avoir vu avant.</p>';
    UNIVERS.forEach(function(g){
      var items = Object.keys(ITEM).filter(function(id){ return PHASE[id] !== "hors" && g[1].indexOf(univ(id)) >= 0; }).sort(byRelease).map(function(id){ return ITEM[id]; });
      if (items.length) html += sectionHTML(g[0], g[2], items, false);
    });
    html += '<button type="button" class="cinema" data-info="doomsday" aria-haspopup="dialog"><strong>Avengers: Doomsday</strong><span>16/12/2026 · au cinéma · ce qu\u2019il faut avoir vu \u24D8</span></button>';
    return html;
  }
  function horsHTML(){
    var html = '<p class="intro">Les adaptations Marvel sans aucun lien avec le MCU ni avec Doomsday : d\u2019autres studios, la télé d\u2019avant 2008 et l\u2019animation. À regarder pour la culture, quand tu veux. Les coches sont les mêmes dans tous les onglets.</p>';
    BLOCKS.forEach(function(b){
      if (b.phase !== "hors") return;
      var items = b.items.map(function(it){ return it[0]; }).sort(byRelease).map(function(id){ return ITEM[id]; });
      html += sectionHTML(b.name, b.note, items, true);
    });
    return html;
  }
  var clearStep = 0, clearTimer = null, undoSet = null;
  function clearHTML(){
    if (clearStep === 1) return '<span class="ask">Tout décocher ?</span><button type="button" class="cbtn danger" id="clear-yes">Oui, tout décocher</button><button type="button" class="cbtn" id="clear-no">Annuler</button>';
    if (clearStep === 2) return '<span class="ask">Tout est décoché.</span><button type="button" class="cbtn" id="clear-undo">Rétablir mes coches</button>';
    return '<button type="button" class="cbtn" id="clear-all"' + (done.size ? "" : " disabled") + '>Tout décocher</button>';
  }
  function showClear(step){
    clearStep = step;
    if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
    var z = document.getElementById("clear-zone"); if (z) z.innerHTML = clearHTML();
    if (step === 1) { var y = document.getElementById("clear-no"); if (y) y.focus(); clearTimer = setTimeout(function(){ showClear(0); }, 8000); }
    if (step === 2) clearTimer = setTimeout(function(){ undoSet = null; showClear(0); }, 15000);
  }
  var ALIAS = {
    hulk:"The Incredible Hulk", cap1:"The First Avenger", thor2:"The Dark World", cap2:"The Winter Soldier", gotg1:"Guardians of the Galaxy",
    aou:"Age of Ultron", gotg2:"Guardians of the Galaxy Vol 2", amw:"Ant-Man and the Wasp", avg1:"The Avengers",
    ff05:"Fantastic Four", ff07:"Rise of the Silver Surfer", ff15:"Fant4stic Fantastic Four", fffs:"Les 4 Fantastiques Premiers Pas",
    bh6:"Big Hero 6", bh6s:"Big Hero 6 The Series", hwmd:"Where Monsters Dwell", ihulk:"The Incredible Hulk", asmtv:"The Amazing Spider-Man",
    fws:"Falcon et le Soldat de l'hiver", eternals:"Les Éternels", shangchi:"Shang-Chi et la Légende des Dix Anneaux",
    ffh:"Spider-Man Loin de chez lui", nwh:"Spider-Man Pas de retour possible", ds2:"Doctor Strange 2 multivers de la folie",
    thor4:"Thor Amour et tonnerre", wf:"Black Panther 2", quantum:"Ant-Man et la Guêpe Quantumania", gotg3:"Les Gardiens de la Galaxie 3",
    ghs:"Les Gardiens de la Galaxie Joyeuses Fêtes", marvels:"Captain Marvel 2", bnw:"Captain America 4", tbolts:"Thunderbolts New Avengers",
    xm3:"L'Affrontement final", xmfc:"X-Men Le Commencement", wolv:"Wolverine Le Combat de l'immortel", xmo:"X-Men Origins Wolverine",
    dofp:"X-Men Days of Future Past", nmut:"Les Nouveaux Mutants", dphx:"X-Men Dark Phoenix",
    itsv:"Spider-Man New Generation", atsv:"Spider-Man Across the Spider-Verse", asm2:"Le Destin d'un héros",
    ven2:"Venom 2", ven3:"Venom 3", dpw:"Deadpool 3", hc:"Spider-Man Homecoming", endg:"Avengers 4", iw:"Avengers 3",
    ba1:"Daredevil Born Again", ba2:"Daredevil Born Again", def:"Defenders", olk:"Punisher", wi1:"What If", wi2:"What If", wi3:"What If",
    sm1:"Spider-Man 1", sm3:"Spider-Man 3", avemh:"Earth's Mightiest Heroes", avass:"Avengers Assemble"
  };
  function norm(t){ return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
  var HAY = {};
  function hay(id){
    if (!HAY[id]) { var it = ITEM[id]; HAY[id] = " " + norm([it[1], ALIAS[id] || "", univ(id), (RELEASE[id] || "").slice(0, 4), it[2], it[4] || ""].join(" ")) + " "; }
    return HAY[id];
  }
  var query = "";
  function matches(id, q){
    var words = norm(q).split(" ").filter(Boolean);
    if (!words.length) return true;
    var h = hay(id);
    return words.every(function(w){ return h.indexOf(" " + w) >= 0 || (w.length > 2 && h.indexOf(w) >= 0); });
  }
  function searchHTML(){
    var words = norm(query).split(" ").filter(Boolean);
    function inTitle(id){ var t = " " + norm(ITEM[id][1] + " " + (ALIAS[id] || "")) + " "; return words.every(function(w){ return t.indexOf(" " + w) >= 0 || (w.length > 2 && t.indexOf(w) >= 0); }) ? 0 : 1; }
    var ids = Object.keys(ITEM).filter(function(id){ return matches(id, query); }).sort(function(a, b){ return (inTitle(a) - inTitle(b)) || byRelease(a, b); });
    if (!ids.length) return '<div class="noresult"><p><b>Aucun titre ne correspond à « ' + esc(query) + ' ».</b></p><p>Essaie un autre mot, le titre anglais ou français, ou une année.</p><button type="button" class="cbtn" id="search-reset">Effacer la recherche</button></div>';
    var items = ids.map(function(id){ return ITEM[id]; }), s = sums(items);
    return '<p class="intro">' + ids.length + (ids.length > 1 ? " résultats" : " résultat") + ' pour « ' + esc(query) + ' », dans tous les onglets, Hors MCU compris.</p>' +
      '<section class="block results" data-ids="' + ids.join(",") + '"><header><h3>Résultats</h3><span class="meta">' + meta(items) + '</span>' +
      '<span class="segs" aria-hidden="true">' + items.map(function(it){ return '<i' + (done.has(it[0]) ? ' class="on"' : '') + '></i>'; }).join("") + '</span></header><ul>' +
      items.map(function(it){ return rowHTML(it, true); }).join("") + "</ul></section>";
  }
  function listHTML(){
    return query ? searchHTML() : (VIEW === "chrono" ? chronoHTML() : VIEW === "univers" ? universHTML() : VIEW === "hors" ? horsHTML() : sortieHTML());
  }
  function renderList(){
    var l = document.getElementById("list"); if (!l) return;
    l.innerHTML = listHTML();
    var x = document.getElementById("search-x"); if (x) x.hidden = !query;
  }
  function render(){
    var html = '<section class="plate"><p class="eyebrow">Cinéma · mercredi 16 décembre</p><h1>Objectif Doomsday</h1><div id="stats">' + statsHTML() + "</div></section>" +
      '<div class="tabs" role="tablist" aria-label="Affichage de la liste">' +
        '<button type="button" role="tab" id="tab-sortie" data-view="sortie" aria-selected="' + (VIEW === "sortie") + '">Ordre de sortie</button>' +
        '<button type="button" role="tab" id="tab-chrono" data-view="chrono" aria-selected="' + (VIEW === "chrono") + '">Chronologie des événements</button>' +
        '<button type="button" role="tab" id="tab-univers" data-view="univers" aria-selected="' + (VIEW === "univers") + '">Par univers</button>' +
        '<button type="button" role="tab" id="tab-hors" data-view="hors" aria-selected="' + (VIEW === "hors") + '">Hors MCU</button>' +
      '</div>' +
      '<div class="search" role="search"><label class="sr" for="search">Rechercher un film ou une série</label>' +
        '<span class="lens" aria-hidden="true"></span><input type="search" id="search" placeholder="Rechercher un film, une série, une année…" autocomplete="off" spellcheck="false" value="' + esc(query) + '">' +
        '<button type="button" class="sx" id="search-x" aria-label="Effacer la recherche"' + (query ? "" : " hidden") + '>\u2715</button></div>' +
      '<div class="toolbar"><div class="toggles"><label class="toggle" for="hide-seen"><input type="checkbox" id="hide-seen"' + (hideSeen ? " checked" : "") + '> Masquer ce qui est vu</label>' +
        '<label class="toggle" for="hide-why"><input type="checkbox" id="hide-why"' + (hideWhy ? " checked" : "") + '> Masquer les notes (anti-spoil)</label>' +
        '<span class="clear" id="clear-zone">' + clearHTML() + '</span></div>' +
        '<span class="status" id="status" aria-live="polite"></span></div>' +
      '<div id="list">' + listHTML() + '</div>' + EXTRA;
    app.innerHTML = html;
    app.classList.toggle("no-why", hideWhy);
  }
  function refresh(id){
    var li = app.querySelector('[data-row="' + id + '"]');
    if (li) li.classList.toggle("done", done.has(id));
    document.getElementById("stats").innerHTML = statsHTML();
    Array.prototype.forEach.call(app.querySelectorAll("section.block[data-ids]"), function(sec){
      var items = sec.getAttribute("data-ids").split(",").map(function(k){ return ITEM[k]; });
      var s = sums(items);
      sec.querySelector(".meta").textContent = meta(items);
      var segs = sec.querySelectorAll(".segs i");
      items.forEach(function(it, k){ if (segs[k]) segs[k].classList.toggle("on", done.has(it[0])); });
      sec.classList.toggle("complete", s.n === s.count);
    });
  }
  function setStatus(kind){
    var el = document.getElementById("status"); if (!el) return;
    el.textContent = kind === "saved" ? "Enregistré sur cet appareil" : (kind === "nostore" ? "Ce navigateur n'enregistre pas les coches : utilise « Transférer mes coches »" : "");
    el.className = "status" + (kind === "saved" ? " ok" : "");
  }
  function persist(){ if (lsSet(KEY, JSON.stringify(Array.from(done)))) setStatus("saved"); else setStatus("nostore"); }
  function applyCode(txt){
    var ids = String(txt).split(/[\s,;]+/).filter(function(x){ return ALL_IDS[x]; });
    if (!ids.length) return false;
    done = new Set(ids); persist(); render(); return true;
  }

  app.addEventListener("click", function(e){
    var f = e.target.closest ? e.target.closest("[data-fold]") : null;
    if (!f) return;
    var key = f.getAttribute("data-fold"), sec = f.closest("section"), shut = !sec.classList.contains("shut");
    sec.classList.toggle("shut", shut); f.setAttribute("aria-expanded", String(!shut));
    if (shut) FOLD[key] = 1; else delete FOLD[key];
    try { localStorage.setItem("objectif-doomsday:fold", JSON.stringify(FOLD)); } catch (err) {}
  });
  app.addEventListener("click", function(e){
    var id = e.target && e.target.id;
    if (id === "clear-all") { showClear(1); return; }
    if (id === "clear-no") { showClear(0); var c = document.getElementById("clear-all"); if (c) c.focus(); return; }
    if (id === "clear-yes") {
      undoSet = new Set(done); done = new Set(); persist(); render(); showClear(2);
      var u = document.getElementById("clear-undo"); if (u) u.focus(); return;
    }
    if (id === "clear-undo" && undoSet) { done = undoSet; undoSet = null; persist(); render(); showClear(0); return; }
  });
  app.addEventListener("click", function(e){
    var info = e.target.closest ? e.target.closest("[data-info]") : null;
    if (info) { openInfo(info.getAttribute("data-info")); return; }
  });
  app.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-view]") : null;
    if (!b) return;
    var v = b.getAttribute("data-view");
    if (v === VIEW && !query) return;
    query = "";
    VIEW = v;
    try { localStorage.setItem("objectif-doomsday:view", VIEW); } catch (err) {}
    render();
    var t = document.getElementById("tab-" + VIEW); if (t) t.focus();
  });
  function setQuery(q, keepFocus){
    query = q;
    var inp = document.getElementById("search"); if (inp && inp.value !== q) inp.value = q;
    renderList();
    if (keepFocus && inp) inp.focus();
  }
  app.addEventListener("input", function(e){ if (e.target.id === "search") setQuery(e.target.value.trim() ? e.target.value : ""); });
  app.addEventListener("keydown", function(e){ if (e.target.id === "search" && e.key === "Escape" && query) { e.preventDefault(); setQuery("", true); } });
  app.addEventListener("click", function(e){
    var id = e.target && e.target.id;
    if (id === "search-x" || id === "search-reset") setQuery("", true);
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "") && !document.querySelector("dialog[open]")) {
      var inp = document.getElementById("search"); if (inp) { e.preventDefault(); inp.focus(); inp.select(); }
    }
  });
  render();
  if (!storageOk) setStatus("nostore");

  app.addEventListener("change", function(e){
    var t = e.target;
    if (t.id === "hide-seen") { hideSeen = t.checked; lsSet(HIDE, hideSeen ? "1" : "0"); render(); return; }
    if (t.id === "hide-why") { hideWhy = t.checked; lsSet(NOWHY, hideWhy ? "1" : "0"); app.classList.toggle("no-why", hideWhy); return; }
    var id = t.getAttribute("data-id"); if (!id) return;
    if (t.checked) done.add(id); else done.delete(id);
    refresh(id); persist(); if (clearStep === 0) showClear(0);
  });
  app.addEventListener("click", function(e){
    var t = e.target, box = document.getElementById("transfer-code"), msg = document.getElementById("transfer-msg");
    if (t.id === "copy-code") {
      box.value = Array.from(done).sort().join(",");
      var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(box.value) : Promise.reject();
      p.then(function(){ msg.textContent = "Code copié. Colle-le sur ton autre appareil."; })
       .catch(function(){ box.select(); msg.textContent = "Code sélectionné : copie-le avec Ctrl+C ou un appui long."; });
    }
    if (t.id === "apply-code") {
      var ok = applyCode(box.value);
      var m2 = document.getElementById("transfer-msg");
      if (m2) m2.textContent = ok ? "Coches importées." : "Code non reconnu. Vérifie que tu as tout collé.";
      if (ok) { var d = app.querySelector(".transfer"); if (d) d.open = true; }
    }
  });
})();
</script>
