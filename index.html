<title>Objectif Doomsday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: comic-panel column. A red splash header with a countdown burst and a ring gauge, then inked panels of checkable rows on halftone paper. */
:root{
  --bg:#fbfaf6; --surface:#ffffff; --ink:#141414; --muted:#56565c; --edge:#141414; --shadow:#141414; --soft:#e4e2dd;
  --red:#d42a2f; --yellow:#ffcc29; --on-red:#ffffff; --on-yellow:#141414; --done:#9b9ba1; --dots:rgba(212,42,47,.15);
  --accent:var(--red);
  --f-display:"Bangers",Impact,"Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101013; --surface:#1a1a1f; --ink:#f2f2f2; --muted:#a8a8b0; --edge:#000000; --shadow:#000000; --soft:#2b2b32;
  --red:#e8353a; --yellow:#ffd23f; --done:#6e6e76; --dots:rgba(232,53,58,.16); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101013; --surface:#1a1a1f; --ink:#f2f2f2; --muted:#a8a8b0; --edge:#000000; --shadow:#000000; --soft:#2b2b32;
  --red:#e8353a; --yellow:#ffd23f; --done:#6e6e76; --dots:rgba(232,53,58,.16); color-scheme:dark}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dots) 1.3px,transparent 1.8px);background-size:11px 11px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}

.plate{position:relative;overflow:hidden;background:var(--red);color:var(--on-red);border:3px solid var(--edge);border-radius:4px;box-shadow:6px 6px 0 var(--shadow);padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px}
.plate::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 105% -10%,rgba(255,255,255,.11) 0deg 5deg,transparent 5deg 11deg);pointer-events:none}
.plate::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.22) 1.2px,transparent 1.7px);background-size:8px 8px;-webkit-mask-image:linear-gradient(to top,#000,transparent 65%);mask-image:linear-gradient(to top,#000,transparent 65%);pointer-events:none}
.plate>*{position:relative;z-index:1}
.eyebrow{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,11vw,88px);line-height:.9;letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--yellow);-webkit-text-stroke:1.5px var(--edge);text-shadow:4px 4px 0 var(--edge);text-wrap:balance}

.hud{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:18px}
.burst{width:122px;height:122px;display:grid;place-content:center;text-align:center;background:var(--yellow);color:var(--on-yellow);clip-path:polygon(50% 0,61% 17%,82% 8%,80% 30%,100% 36%,86% 52%,100% 68%,79% 72%,82% 94%,61% 84%,50% 100%,39% 84%,18% 94%,21% 72%,0 68%,14% 52%,0 36%,20% 30%,18% 8%,39% 17%);transform:rotate(-6deg)}
.burst b{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1;letter-spacing:.02em}
.burst span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.gauge{width:116px;height:116px;display:block}
.g-track{fill:none;stroke:rgba(0,0,0,.28);stroke-width:13}
.g-fill{fill:none;stroke:var(--yellow);stroke-width:13;transition:stroke-dashoffset .4s}
.g-num{font-family:var(--f-display);font-size:32px;fill:var(--on-red);text-anchor:middle}
.g-lab{font-family:var(--f-body);font-size:9.5px;font-weight:600;letter-spacing:.08em;fill:var(--on-red);text-anchor:middle}
.nums{display:grid;gap:7px;min-width:0}
.nums div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:6px;border-bottom:2px dashed rgba(255,255,255,.35)}
.nums div:last-child{border-bottom:0;padding-bottom:0}
.nums b{font-family:var(--f-mono);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.nums span{font-size:12.5px}
@media (max-width:560px){.hud{grid-template-columns:auto auto;justify-content:start}.nums{grid-column:1/-1}}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:500;background:var(--surface);border:2px solid var(--edge);border-radius:3px;padding:5px 10px}
.toggle input{width:18px;height:18px;accent-color:var(--red)}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-height:1em}
.status.ok{color:var(--ink);font-weight:500}

.phase{display:flex;align-items:center;gap:12px;margin:12px 0 -6px}
.phase h2{font-family:var(--f-display);font-weight:400;font-size:36px;letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--ink)}
.phase p{margin:0;color:var(--muted);font-size:13px}
.phase::after{content:"";flex:1;height:5px;background:var(--red);transform:skewX(-20deg)}

.block{background:var(--surface);border:3px solid var(--edge);border-radius:4px;box-shadow:5px 5px 0 var(--shadow);overflow:hidden}
.block header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 14px 12px;background:var(--edge);color:var(--on-red)}
.block h3{font-family:var(--f-display);font-weight:400;font-size:27px;letter-spacing:.04em;text-transform:uppercase;margin:0;flex:1;min-width:0;color:var(--yellow)}
.block .meta{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;opacity:.85}
.block .bnote{flex-basis:100%;margin:0;font-size:12.5px;opacity:.78}
.segs{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px;padding-top:2px}
.segs i{flex:1 1 10px;min-width:8px;max-width:30px;height:9px;background:rgba(255,255,255,.18);transform:skewX(-18deg)}
.segs i.on{background:var(--red)}
.block.complete header{background:var(--red)}
.block.complete h3{color:var(--yellow);-webkit-text-stroke:1px var(--edge)}
.block.complete .segs i.on{background:var(--yellow)}

ul{list-style:none;margin:0;padding:0}
li+li{border-top:1px solid var(--soft)}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--yellow) 16%,transparent)}
.row input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:22px;height:22px;border:3px solid var(--ink);border-radius:3px;display:grid;place-items:center;background:var(--surface);transition:background .15s,transform .15s}
.box::after{content:"";width:10px;height:5px;border-left:3px solid var(--on-red);border-bottom:3px solid var(--on-red);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.row input:checked+.box{background:var(--red);transform:rotate(-6deg)}
.row input:checked+.box::after{opacity:1}
.row input:focus-visible+.box{outline:3px solid var(--yellow);outline-offset:2px}
.name{min-width:0;overflow-wrap:anywhere;font-weight:500}
.name small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.kind{font-family:var(--f-display);font-size:15px;line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:var(--on-yellow);background:var(--yellow);border:2px solid var(--edge);border-radius:3px;padding:0 7px;transform:rotate(-3deg)}
.kind.serie{background:var(--surface);color:var(--ink);border-color:var(--ink);transform:rotate(2deg)}
.dur{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:4.6em}
li.done .name{color:var(--done);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
li.done .kind{opacity:.45}

.cinema{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--yellow);color:var(--on-yellow);border:3px solid var(--edge);border-radius:4px;box-shadow:6px 6px 0 var(--red);padding:16px 18px;transform:rotate(-1deg);margin-block:8px}
.cinema strong{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1;letter-spacing:.03em;text-transform:uppercase;color:var(--red);-webkit-text-stroke:1px var(--edge)}
.cinema span{font-family:var(--f-mono);font-size:13px;font-weight:500}

.transfer{background:var(--surface);border:3px solid var(--edge);border-radius:4px;box-shadow:5px 5px 0 var(--shadow);padding:12px 14px}
.transfer summary{cursor:pointer;font-weight:600}
.transfer p{color:var(--muted);font-size:13px;margin:10px 0}
.transfer textarea{width:100%;font-family:var(--f-mono);font-size:12px;background:var(--bg);color:var(--ink);border:2px solid var(--edge);border-radius:3px;padding:8px;resize:vertical}
.tbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tbtns button{font-family:var(--f-display);font-size:18px;letter-spacing:.05em;padding:4px 14px;border-radius:3px;border:2px solid var(--edge);background:var(--red);color:var(--on-red);cursor:pointer;box-shadow:3px 3px 0 var(--edge)}
.tbtns button+button{background:var(--surface);color:var(--ink)}
.tbtns button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.tbtns button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.tabs{display:flex;flex-wrap:wrap}
.tabs button{flex:1 1 auto;font-family:var(--f-display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;padding:8px 16px;background:var(--surface);color:var(--ink);border:3px solid var(--edge);cursor:pointer}
.tabs button+button{margin-left:-3px}
.tabs button[aria-selected="true"]{background:var(--yellow);color:var(--on-yellow);box-shadow:inset 0 -6px 0 var(--red)}
.tabs button:focus-visible{outline:3px solid var(--red);outline-offset:2px;position:relative;z-index:1}
.intro{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.block.year h3{font-size:34px}
@media (max-width:560px){.block h3{flex-basis:100%}}
@media (max-width:420px){.kind{display:none}.row{grid-template-columns:24px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  var ITEM = {}, PHASE = {}; BLOCKS.forEach(function(b){ b.items.forEach(function(it){ ITEM[it[0]] = it; PHASE[it[0]] = b.phase; }); });

  var EXTRA = '<details class="transfer"><summary>Transférer mes coches vers un autre appareil</summary><p>Les coches sont gardées dans ce navigateur. Pour les retrouver sur ton téléphone ou un autre ordi, copie ton code ici, colle-le là-bas, puis clique sur « Importer ce code ».</p><textarea id="transfer-code" rows="3" spellcheck="false" aria-label="Code de progression"></textarea><div class="tbtns"><button type="button" id="copy-code">Copier mon code</button><button type="button" id="apply-code">Importer ce code</button></div><p class="status" id="transfer-msg" aria-live="polite"></p></details>';

  function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fmt(min){
    if (min <= 0) return "0 h";
    var h = Math.floor(min/60), m = Math.round(min%60);
    if (h === 0) return m + " min";
    return h + " h" + (m ? " " + (m < 10 ? "0" : "") + m : "");
  }
  function daysLeft(){

    return Math.round((CINEMA - today) / 86400000);
  }
  function sums(items){

    var pace = d > 0 ? fmt(Math.ceil(s.left / d)) : "—";

    return '<div class="hud">' +
      '<div class="burst"><b>' + (d > 0 ? "J-" + d : (d === 0 ? "Jour J" : "Vu !")) + '</b><span>avant le ciné</span></div>' +

      '<div class="nums">' +

        '<div><b>' + pace + '</b><span>par jour à tenir</span></div>' +
      '</div></div>';
  }
  function subline(it, withUniv){
    var parts = [];
    if (withUniv) parts.push(univ(it[0]));
    if (EPISODES[it[0]]) parts.push(EPISODES[it[0]] + " épisodes");
    if (it[4]) parts.push(it[4]);
    if (PHASE[it[0]] === "apres") parts.push("prévu après Doomsday");

  }
  function planHTML(){
